name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tfwatch
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tfwatch
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U tfwatch" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tfwatch:ci-only@localhost:5432/tfwatch
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Compose stack
        run: |
          cp .env.example .env
          docker compose build migrate
          key=$(docker compose run --rm --no-deps migrate python -m tfwatch.cli key)
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$key|" .env
          docker compose up -d
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://localhost:8000/api/health
          docker compose top worker
      - name: Check corresponding source
        run: |
          curl -fsS http://localhost:8000/api/source -o /tmp/tfwatch-source.tar.gz
          tar -tzf /tmp/tfwatch-source.tar.gz | grep -Fx tfwatch/LICENSE
      - name: Stop Compose stack
        if: always()
        run: |
          docker compose logs
          docker compose down --volumes
