x-base: &base
  image: tfwatch:local
  env_file: .env
  volumes:
    - tfwatch-data:/data
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *base
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
  api:
    <<: *base
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *base
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "tfwatch.worker"]

volumes:
  tfwatch-data:
